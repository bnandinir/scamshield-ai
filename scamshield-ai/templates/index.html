<!DOCTYPE html>
<html>
<head>
    <title>ScamShield AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>ScamShield AI</h1>

    <form method="POST">
        <textarea name="message" placeholder="Enter message here..." required></textarea>

        <br>

        <button type="submit">Detect Scam</button>
    </form>

    {% if result %}
        <div class="result">
            <h2>{{ result }}</h2>
            <p>{{ risk }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
